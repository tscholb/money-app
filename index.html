<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>가계부</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>가계부</h1>
    <div class="month-nav">
      <button id="prevMonth" aria-label="이전 달">&larr;</button>
      <span id="currentMonth"></span>
      <button id="nextMonth" aria-label="다음 달">&rarr;</button>
    </div>
  </header>

  <main class="container">
    <section class="summary">
      <div class="card income">
        <span class="label">수입</span>
        <strong id="totalIncome">0원</strong>
      </div>
      <div class="card expense">
        <span class="label">지출</span>
        <strong id="totalExpense">0원</strong>
      </div>
      <div class="card balance">
        <span class="label">잔액</span>
        <strong id="totalBalance">0원</strong>
      </div>
    </section>

    <section class="panel">
      <h2>내역 추가</h2>
      <form id="txForm" class="tx-form">
        <div class="field toggle">
          <label>
            <input type="radio" name="type" value="expense" checked />
            <span>지출</span>
          </label>
          <label>
            <input type="radio" name="type" value="income" />
            <span>수입</span>
          </label>
        </div>

        <div class="field">
          <label for="date">날짜</label>
          <input type="date" id="date" required />
        </div>

        <div class="field">
          <label for="category">카테고리</label>
          <select id="category" required></select>
        </div>

        <div class="field">
          <label for="amount">금액</label>
          <input type="number" id="amount" min="1" step="1" placeholder="0" required />
        </div>

        <div class="field grow">
          <label for="memo">메모</label>
          <input type="text" id="memo" placeholder="(선택) 메모" maxlength="100" />
        </div>

        <button type="submit" class="primary">추가</button>
      </form>
    </section>

    <section class="panel">
      <div class="list-header">
        <h2>내역</h2>
        <div class="filters">
          <select id="filterType">
            <option value="all">전체</option>
            <option value="expense">지출만</option>
            <option value="income">수입만</option>
          </select>
          <select id="filterCategory">
            <option value="all">카테고리 전체</option>
          </select>
        </div>
      </div>

      <ul id="txList" class="tx-list"></ul>
      <p id="emptyMsg" class="empty">이번 달 내역이 없습니다.</p>
    </section>

    <section class="panel">
      <h2>카테고리별 지출</h2>
      <ul id="categoryBreakdown" class="breakdown"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
